</main><script>
const boxes=[...document.querySelectorAll('input[type=checkbox]')];
boxes.forEach(b=>{b.checked=localStorage.getItem(b.dataset.key)==='1';b.addEventListener('change',()=>{localStorage.setItem(b.dataset.key,b.checked?'1':'0');update()})});
function update(){document.getElementById('count').textContent=boxes.filter(b=>b.checked).length+' / '+boxes.length+' チェック済み';}
document.getElementById('reset').addEventListener('click',()=>{if(confirm('チェックを全部外しますか？')){boxes.forEach(b=>{b.checked=false;localStorage.removeItem(b.dataset.key)});update()}});
update();
</script></body></html>
