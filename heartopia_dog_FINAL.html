<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ハートピア 犬エサチェックリスト</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont,
  "Hiragino Sans", sans-serif;
  background: #fff7f8;
  color: #555;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

.pet-name {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.photo-area {
  width: 160px;
  height: 160px;
  margin: 15px auto;
  border-radius: 20px;
  overflow: hidden;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
}

.photo-area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.button {
  border: none;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  background: white;
  margin: 5px;
}

.center {
  text-align: center;
}

.food-list {
  margin-top: 20px;
}

.food {
  background: white;
  border-radius: 15px;
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.food input[type="checkbox"] {
  width: 25px;
  height: 25px;
}

.food-name {
  flex: 1;
  font-size: 18px;
}

.delete-button {
  border: none;
  background: #eee;
  border-radius: 8px;
  padding: 6px 10px;
}

.add-area {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-top: 20px;
}

.add-area input[type="text"] {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin-bottom: 10px;
}

.hidden {
  display: none;
}
</style>

</head>

<body>

<div class="container">

<h1>🐶 犬のエサチェック</h1>

<div id="petName" class="pet-name">
わんちゃん
</div>


<div id="photoArea" class="photo-area">
🐶
</div>


<div class="center">

<label class="button">

📷 犬の画像を変更

<input
id="categoryPhoto"
type="file"
accept="image/*"
class="hidden"
>

</label>

</div>


<div
id="foodList"
class="food-list">
</div>


<div class="add-area">

<input
id="foodName"
type="text"
placeholder="追加するエサの名前"
>

<label class="button">

🖼️ エサ画像を選ぶ

<input
id="foodImage"
type="file"
accept="image/*"
class="hidden"
>

</label>


<button
class="button"
onclick="addFood()">

＋ エサを追加

</button>

</div>


</div>


<script>

/* =========================
   ペットIDを取得
========================= */

const params =
new URLSearchParams(
window.location.search
);

const petId =
params.get("id") || "dog1";

const petName =
params.get("pet") || "わんちゃん";

document.getElementById(
"petName"
).textContent = petName;


/* =========================
   犬カテゴリ共通の写真
========================= */

const categoryPhotoKey =
"heartopia_dog_category_photo";

const savedPhoto =
localStorage.getItem(
categoryPhotoKey
);

const photoArea =
document.getElementById(
"photoArea"
);


if (savedPhoto) {

photoArea.innerHTML =
`<img src="${savedPhoto}">`;

}


document.getElementById(
"categoryPhoto"
).addEventListener(
"change",
function() {

const file =
this.files[0];

if (!file) return;

const reader =
new FileReader();


reader.onload =
function(e) {

const image =
e.target.result;

localStorage.setItem(
categoryPhotoKey,
image
);

photoArea.innerHTML =
`<img src="${image}">`;

};


reader.readAsDataURL(
file
);

}
);


/* =========================
   エサ一覧を保存
   犬カテゴリ全員共通
========================= */

const foodsKey =
"heartopia_dog_foods";

let foods =
JSON.parse(
localStorage.getItem(
foodsKey
)
) || [

{
name: "エサ1",
image: ""
},

{
name: "エサ2",
image: ""
}

];


/* =========================
   エサ一覧を表示
========================= */

function renderFoods() {

const list =
document.getElementById(
"foodList"
);

list.innerHTML = "";


foods.forEach(
function(food, index) {

const foodDiv =
document.createElement("div");

foodDiv.className =
"food";


const checkKey =
"heartopia_" +
petId +
"_food_" +
index;


const checked =
localStorage.getItem(
checkKey
) === "true";


foodDiv.innerHTML =

`

<input
type="checkbox"
${checked ? "checked" : ""}
>

${food.image
? `<img
src="${food.image}"
style="
width:55px;
height:55px;
object-fit:cover;
border-radius:10px;
">`
: ""
}

<div class="food-name">

${food.name}

</div>

<button
class="delete-button">

削除

</button>

`;


const checkbox =
foodDiv.querySelector(
'input[type="checkbox"]'
);


checkbox.addEventListener(
"change",
function() {

localStorage.setItem(
checkKey,
checkbox.checked
);

}
);


const deleteButton =
foodDiv.querySelector(
".delete-button"
);


deleteButton.onclick =
function() {

foods.splice(
index,
1
);


localStorage.setItem(
foodsKey,
JSON.stringify(
foods
)
);


renderFoods();

};


list.appendChild(
foodDiv
);

}
);

}


/* =========================
   エサを追加
========================= */

function addFood() {

const nameInput =
document.getElementById(
"foodName"
);

const imageInput =
document.getElementById(
"foodImage"
);


const name =
nameInput.value.trim();


if (!name) {

alert(
"エサの名前を入力してください"
);

return;

}


const file =
imageInput.files[0];


if (file) {

const reader =
new FileReader();


reader.onload =
function(e) {

foods.push({

name: name,

image: e.target.result

});


localStorage.setItem(
foodsKey,
JSON.stringify(
foods
)
);


nameInput.value = "";

imageInput.value = "";


renderFoods();

};


reader.readAsDataURL(
file
);

}

else {

foods.push({

name: name,

image: ""

});


localStorage.setItem(
foodsKey,
JSON.stringify(
foods
)
);


nameInput.value = "";


renderFoods();

}

}


/* =========================
   最初に表示
========================= */

renderFoods();

</script>

</body>
</html>
