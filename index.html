<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ハートピア ペット登録</title>

<style>
body {
  margin: 0;
  background: #fff8f7;
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Sans", sans-serif;
  color: #443d42;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 20px 14px 60px;
}

h1 {
  text-align: center;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  border: none;
  border-radius: 16px;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  background: white;
}

.tab.active {
  background: #ffdfe6;
}

.panel {
  display: none;
}

.panel.active {
  display: block;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 15px;
  margin: 12px 0;
  box-shadow: 0 3px 12px #00000012;
}

.pet-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.photo-box {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  overflow: hidden;
  background: #fff0f3;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
}

.photo-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.name-area {
  flex: 1;
}

.name-input {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.save-button,
.photo-button {
  border: none;
  border-radius: 12px;
  padding: 10px 12px;
  margin-top: 8px;
  font-size: 14px;
}

.save-button {
  background: #ffdfe6;
}

.photo-button {
  background: #f2f2f2;
  display: inline-block;
}

.go-button {
  display: block;
  text-align: center;
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  background: #f7f7f7;
  text-decoration: none;
  color: #443d42;
  font-weight: bold;
}
</style>
</head>

<body>

<main>

<h1>🐾 ハートピア<br>ペット登録</h1>

<p style="text-align:center">
猫・犬をそれぞれ最大5匹登録できます
</p>

<div class="tabs">

<button
class="tab active"
onclick="showPanel('cat', this)">
🐱 猫
</button>

<button
class="tab"
onclick="showPanel('dog', this)">
🐶 犬
</button>

</div>

<div id="cat" class="panel active"></div>

<div id="dog" class="panel"></div>

</main>


<script>

function showPanel(id, button) {

  document
    .querySelectorAll('.panel')
    .forEach(function(panel) {
      panel.classList.remove('active');
    });

  document
    .querySelectorAll('.tab')
    .forEach(function(tab) {
      tab.classList.remove('active');
    });

  document
    .getElementById(id)
    .classList.add('active');

  button.classList.add('active');
}


function buildPets(type, emoji, file) {

  const area =
    document.getElementById(type);


  for (let i = 1; i <= 5; i++) {

    const nameKey =
      'heartopia_' +
      type +
      '_name_' +
      i;

    const photoKey =
      'heartopia_' +
      type +
      '_photo_' +
      i;


    const savedName =
      localStorage.getItem(nameKey) || '';

    const savedPhoto =
      localStorage.getItem(photoKey);


    const card =
      document.createElement('div');

    card.className = 'card';


    card.innerHTML = `

<div class="pet-row">

<div class="photo-box">

${
  savedPhoto
  ? `<img src="${savedPhoto}">`
  : emoji
}

</div>


<div class="name-area">

<input
class="name-input"
placeholder="名前を入力"
value="${savedName}"
>

<button class="save-button">
名前を保存
</button>

<br>

<label class="photo-button">

📷 写真を選ぶ

<input
type="file"
accept="image/*"
style="display:none"
>

</label>

</div>

</div>


<a
href="#"
class="go-button"
>

この子のチェックリストを開く →

</a>

`;


    const nameInput =
      card.querySelector('.name-input');

    const saveButton =
      card.querySelector('.save-button');

    const photoInput =
      card.querySelector(
        'input[type="file"]'
      );

    const photoBox =
      card.querySelector('.photo-box');

    const goButton =
      card.querySelector('.go-button');


    saveButton.onclick =
    function() {

      localStorage.setItem(
        nameKey,
        nameInput.value.trim()
      );

      saveButton.textContent =
        '保存した！';

      setTimeout(
        function() {

          saveButton.textContent =
            '名前を保存';

        },
        1000
      );

    };


    photoInput.onchange =
    function() {

      const file =
        photoInput.files[0];

      if (!file) return;


      const reader =
        new FileReader();


      reader.onload =
      function(event) {

        const image =
          event.target.result;


        localStorage.setItem(
          photoKey,
          image
        );


        photoBox.innerHTML =
          `<img src="${image}">`;

      };


      reader.readAsDataURL(file);

    };


    goButton.onclick =
    function(event) {

      event.preventDefault();


      let petName =
        nameInput.value.trim();


      if (petName === '') {

        petName =
          type +
          i;

      }


      localStorage.setItem(
        nameKey,
        petName
      );


      location.href =

        file +

        '?pet=' +

        encodeURIComponent(
          petName
        ) +

        '&id=' +

        type +

        i;

    };


    area.appendChild(card);

  }

}


buildPets(
  'cat',
  '🐱',
  'heartopia_cat_FINAL_fixed.html'
);


buildPets(
  'dog',
  '🐶',
  'heartopia_dog_FINAL_new.html'
);

</script>

</body>
</html>
