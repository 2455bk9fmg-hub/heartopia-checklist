:root{--accent:#6586e8;--ink:#443d42}
*{box-sizing:border-box}body{margin:0;background:#fff8f8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink)}

input:checked+.check{background:var(--accent);border-color:var(--accent)}input:checked+.check:after{content:"✓";color:#fff;font-weight:900;font-size:19px}input:checked~.name{text-decoration:line-through;opacity:.48}
.note{text-align:center;font-size:12px;opacity:.55;margin:20px}

function parseInitial(){let d=document.createElement('div');d.innerHTML='<div>'+initial+'</div>';return [...d.querySelectorAll('label.item')].map((x,i)=>({id:'base-'+i,html:x.outerHTML,name:x.querySelector('.name')?.textContent.trim()||'',img:x.querySelector('img')?.src||''}));}
let foods=JSON.parse(localStorage.getItem(FKEY)||'null')||parseInitial();
const CORRECT_NAMES=['動物共通のエサ', 'キャットフード', 'ヨーロピアンパーチ', 'コウライエビ', 'シマドジョウ', 'パーバル', 'オーストラレア', 'ミノー', 'チャブ', 'テンチ', 'マナ', 'ブリーム', 'ホワイトフィッシュ', 'シュナイダー', 'ニシイワシ', 'スズキ', 'カツオ', 'タチウオ', 'ウミエビ', 'マアジ', 'ストライプドトレバリー', 'インドショウ', 'ラップ', 'アマゾンカマス', 'キュウリウオ', 'フランスアジ', 'アンコウ', 'ウニドウオ', 'タツノオトシゴ', 'バイカバーチ', 'メガネ', 'オタマジャクシ', '北欧アカエビ', 'イシモチ', 'オオクチバス', 'ビワモロコ', 'ヤドカリ', 'カクレクマノミ', 'テラピア', 'ヨーロッパコイ', 'カワメンタイ', 'レッドテールモラ', 'ヨーロッパワサビガエル', 'サワガニ', 'パラダライコ', 'マダコ', 'カイツブリ', 'ハゼ', 'ヨーロッパヒラメ', 'カワゴボウ', 'マス', 'ラッド', 'ライセイヨウサバ', 'ヨーロッパロブスター', 'ヨーロッパイカ', 'ソロザケ', 'シンジガイ', 'カワヒメマス', 'フグ', 'タワ・ガーネット', 'ネコメ', 'イチヨ', 'アンブロイネル', 'カジカ', 'ショウジンガニ', 'スペインダイ', 'ヨーロッパウナギ', 'マッドミノー', '北欧アオザメ', 'キンギョ', '黄金タラバガニ', 'タラバガニ', 'モンシボラ', 'ドラウト', 'ノーザンパイク', 'ハンテッド', 'ミナミマグロ', 'マンボウ', 'アカマンボウ', 'ヨーロッパナマズ', 'ブルーギル', 'キンギョウオ', 'メガネウオ', 'シュモクザメ', 'アオザメ', '氷海のタラバガニ', '氷海のマンボウ', '氷海のフグ'];
let changed=false;foods.forEach(f=>{if(/^base-\d+$/.test(f.id)){let i=Number(f.id.slice(5));if(CORRECT_NAMES[i]&&f.name!==CORRECT_NAMES[i]){f.name=CORRECT_NAMES[i];changed=true;}}});if(changed)saveFoods();
const list=document.querySelector('.list');
function saveFoods(){localStorage.setItem(FKEY,JSON.stringify(foods));}
function render(){list.innerHTML='';foods.forEach((f,i)=>{let w=document.createElement('div');w.innerHTML=f.html||`<label class="item new-item"><img src="${f.img||''}"><span class="name"></span><input type="checkbox"><span class="check"></span></label>`;let item=w.firstElementChild;let n=item.querySelector('.name');n.textContent=f.name;if(f.img&&item.querySelector('img'))item.querySelector('img').src=f.img;let cb=item.querySelector('input');let key='heartopia_'+TYPE+'_pet_'+PET+'_food_'+f.id;cb.checked=localStorage.getItem(key)==='1';cb.onchange=()=>{localStorage.setItem(key,cb.checked?'1':'0');update();};let del=document.createElement('button');del.textContent='削除';del.className='del fooddel';del.type='button';del.onclick=(e)=>{e.preventDefault();e.stopPropagation();if(confirm('「'+f.name+'」を削除しますか？')){foods.splice(i,1);saveFoods();render();}};item.appendChild(del);list.appendChild(item);});update();}
function update(){let b=[...list.querySelectorAll('input[type=checkbox]')];document.getElementById('count').textContent=b.filter(x=>x.checked).length+' / '+b.length+' チェック済み';}
document.getElementById('reset').onclick=()=>{if(confirm('この子のチェックを全部外しますか？')){list.querySelectorAll('input[type=checkbox]').forEach((b,i)=>{b.checked=false;let f=foods[i];localStorage.removeItem('heartopia_'+TYPE+'_pet_'+PET+'_food_'+f.id);});update();}};
document.getElementById('addFood').onclick=()=>{let n=document.getElementById('newName').value.trim(),fi=document.getElementById('newImage').files[0];if(!n)return alert('エサの名前を入力してね');let add=(img)=>{foods.push({id:'add-'+Date.now(),name:n,img,html:''});saveFoods();document.getElementById('newName').value='';document.getElementById('newImage').value='';render();};if(fi){let r=new FileReader();r.onload=e=>add(e.target.result);r.readAsDataURL(fi);}else add('');};
let photo=localStorage.getItem(PHOTO),ph=document.getElementById('categoryPhoto');if(photo)ph.src=photo;else ph.style.display='none';document.getElementById('photoInput').onchange=function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{localStorage.setItem(PHOTO,e.target.result);ph.src=e.target.result;ph.style.display='block';};r.readAsDataURL(f);};
render();
